spring.application.name=calendar

# The datasource comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD in the
# environment. Spring Boot binds those variables on its own, so no database
# value needs to be versioned here. See docker-compose.yml and ci-backend.yml.
info.application=calendar
info.version=0.0.1-SNAPSHOT
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Pool Configuration (prevents connection bloat & memory overhead on small VPS)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000

spring.flyway.locations=classpath:db/migration


jwt.expiration-ms=86400000
jwt.reset-expiration-ms=300000
jwt.email-confirmation-expiration-ms=86400000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:${FRONTEND_PORT:4200}}

# Base URL of the frontend, used to build links sent by email (e.g. the
# email-confirmation link). Not a secret, no default needed to fail closed.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Gmail SMTP, same pattern as the password pepper: credentials only ever
# come from the environment, never hardcoded. Empty defaults (rather than a
# required property) so the app still starts without them — a missing mail
# password breaks email delivery, not security, so it shouldn't crash boot.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Ativa a interface visual do Swagger
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# PERMITE que o SpringDoc leia sua classe Java e gere a documentação
springdoc.api-docs.enabled=true
logging.level.org.springdoc=DEBUG
